name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本读 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Content pack validation (gate)
        run: node tools/content-sync/cli.mjs --check

      - name: Typecheck + tests
        run: pnpm -s turbo run typecheck test

      - name: Dependency direction rules (architecture matrix)
        run: pnpm depcruise

      - name: Build app (vite)
        run: pnpm build
