<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レモネード・ファクトリー — P1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap"
    />
    <style>
      /* mock/ui.html 移植:墨色舞台 + 朱色一点。详细样式归 styles.css,这里只放首帧基础 */
      :root {
        color-scheme: dark;
        --ink: #060709;
        --acc: #c8503a;
        --tx: #f3f1ec;
        --tx-dim: rgba(243, 241, 236, 0.6);
        --hairline: rgba(255, 255, 255, 0.22);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--tx);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Microsoft YaHei", sans-serif;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- mock/ui.html 同构:1920×1080 舞台(JS fit 缩放)= 场景层 + 台词窗 + React chrome -->
    <div id="stage">
      <div class="scene" id="gal-scene"></div>
      <div class="win" id="gal-win">
        <div class="nameplate" id="gal-plate">
          <div class="d"></div>
          <div class="nm"></div>
          <div class="ln"></div>
        </div>
        <div class="text" id="gal-text"></div>
        <div class="next" id="gal-next">▼</div>
      </div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
